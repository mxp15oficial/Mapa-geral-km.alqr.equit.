<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Mapas Profissional</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-search@2.9.8/dist/leaflet-search.min.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: Arial, sans-serif; }
        #map { width: 100%; height: 100vh; }
        
        /* Barra de Pesquisa Fixa no Topo */
        .leaflet-control-search {
            position: absolute !important;
            top: 15px !important;
            left: 60px !important;
            right: 15px !important;
            width: auto !important;
            margin: 0 !important;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4) !important;
            border-radius: 8px !important;
            background: white;
            z-index: 1000;
        }
        .leaflet-control-search .search-input {
            width: 100% !important;
            height: 40px;
            padding: 5px 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
            box-sizing: border-box;
        }
        .leaflet-control-search .search-button { display: none; }

        /* Botão Flutuante Principal */
        #btn-flutuante {
            position: fixed;
            bottom: 30px;
            right: 20px;
            width: 60px;
            height: 60px;
            background-color: #28a745;
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            cursor: pointer;
            z-index: 9999;
            user-select: none;
        }

        /* Menu de Ações (Estilo Leque/Vertical) */
        #menu-flutuante {
            position: fixed;
            bottom: 100px;
            right: 20px;
            background: white;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            display: none;
            z-index: 9999;
            flex-direction: column;
            gap: 8px;
        }
        #menu-flutuante button {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            text-align: left;
            font-size: 14px;
        }
        .btn-marcar { background-color: #007bff; }
        .btn-pdf { background-color: #ffc107; color: black !important; }
        .btn-lixeira { background-color: #dc3545; }

        .user-location-marker {
            background-color: #007bff;
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="btn-flutuante">⚙️</div>
    <div id="menu-flutuante">
        <button class="btn-marcar" onclick="adicionarPontoAtual()">📍 Marcar Ponto</button>
        <button class="btn-pdf" onclick="document.getElementById('file-pdf').click()">📄 Importar PDF</button>
        <button class="btn-lixeira" onclick="apagarTodasMarcacoes()">🗑️ Apagar Tudo</button>
        <input type="file" id="file-pdf" accept=".pdf,.geojson,.kml,.json" style="display: none;" onchange="importarArquivo(event)">
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-search@2.9.8/dist/leaflet-search.min.js"></script>
    <script>
        // 1. Inicialização do Mapa
        const map = L.map('map', {
            maxZoom: 20,
            minZoom: 3
        }).setView([-15.7801, -47.9292], 15);

        // 2. Camada de Satélite com Correção de Zoom (Evita tela cinza/branca)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 20,
            maxNativeZoom: 19,
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        // 3. Camada Híbrida (Adiciona os nomes das ruas e estradas por cima do satélite)
        L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 20,
            maxNativeZoom: 19,
            opacity: 0.9
        }).addTo(map);

        // 4. Geolocalização em Tempo Real
        let markerGPS = null;
        let primeiroZoom = true;

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition((position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;

                if (!markerGPS) {
                    markerGPS = L.marker([lat, lng], {
                        icon: L.divIcon({ className: 'user-location-marker', iconSize: [12, 12], iconAnchor: [6, 6] })
                    }).addTo(map).bindPopup("Você está aqui");
                } else {
                    markerGPS.setLatLng([lat, lng]);
                }

                if (primeiroZoom) {
                    map.setView([lat, lng], 17);
                    primeiroZoom = false;
                }
            }, null, { enableHighAccuracy: true });
        }

        // 5. Camada de Pesquisa de Locais/Talhões
        let camadaPesquisa = L.layerGroup().addTo(map);

        const searchControl = new L.Control.Search({
            layer: camadaPesquisa,
            propertyName: 'title',
            marker: false,
            textPlaceholder: 'Pesquisar local ou rua...',
            moveToLocation: function(latlng, title, map) {
                map.setView(latlng, 18);
            }
        });
        map.addControl(searchControl);

        // 6. Sistema de Pontos Salvos (Persistência Local)
        let marcadoresSalvos = JSON.parse(localStorage.getItem('meus_pontos')) || [];

        marcadoresSalvos.forEach(ponto => {
            let m = L.marker([ponto.lat, ponto.lng]).addTo(map).bindPopup(`Ponto: ${ponto.data}`);
            m.feature = { properties: { title: `Ponto ${ponto.data}` } };
            camadaPesquisa.addLayer(m);
        });

        // 7. Controle do Menu Flutuante
        const btnFlutuante = document.getElementById('btn-flutuante');
        const menuFlutuante = document.getElementById('menu-flutuante');

        L.DomEvent.disableClickPropagation(btnFlutuante);
        L.DomEvent.disableClickPropagation(menuFlutuante);

        btnFlutuante.addEventListener('click', () => {
            menuFlutuante.style.display = (menuFlutuante.style.display === 'flex') ? 'none' : 'flex';
        });

        function adicionarPontoAtual() {
            let pos = markerGPS ? markerGPS.getLatLng() : map.getCenter();
            const dataStr = new Date().toLocaleString();
            
            const novoPonto = { lat: pos.lat, lng: pos.lng, data: dataStr };
            marcadoresSalvos.push(novoPonto);
            localStorage.setItem('meus_pontos', JSON.stringify(marcadoresSalvos));

            let m = L.marker([pos.lat, pos.lng]).addTo(map).bindPopup(`Ponto salvo em: ${dataStr}`).openPopup();
            m.feature = { properties: { title: `Ponto ${dataStr}` } };
            camadaPesquisa.addLayer(m);

            alert('Ponto salvo com sucesso!');
            menuFlutuante.style.display = 'none';
        }

        function importarArquivo(event) {
            const arquivo = event.target.files[0];
            if (!arquivo) return;

            alert(`Arquivo "${arquivo.name}" carregado com sucesso!`);
            menuFlutuante.style.display = 'none';
        }

        function apagarTodasMarcacoes() {
            if (confirm("Deseja apagar todas as marcações?")) {
                localStorage.removeItem('meus_pontos');
                location.reload();
            }
        }

        map.on('click', () => {
            menuFlutuante.style.display = 'none';
        });
    </script>
</body>
</html>
