<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Mapas Satélite Offline</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: Arial, sans-serif; }
        #map { width: 100%; height: 100vh; }
        
        /* Botão Flutuante */
        #btn-flutuante {
            position: fixed;
            bottom: 30px;
            right: 20px;
            width: 60px;
            height: 60px;
            background-color: #28a745;
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            cursor: pointer;
            z-index: 9999;
            user-select: none;
        }

        /* Menu de Ações */
        #menu-flutuante {
            position: fixed;
            bottom: 100px;
            right: 20px;
            background: white;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            display: none;
            z-index: 9999;
            flex-direction: column;
            gap: 8px;
        }
        #menu-flutuante button {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            text-align: left;
            font-size: 14px;
        }
        .btn-marcar { background-color: #007bff; }
        .btn-pdf { background-color: #ffc107; color: black !important; }
        .btn-lixeira { background-color: #dc3545; }

        .user-location-marker {
            background-color: #007bff;
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

    <div id="btn-flutuante">⚙️</div>

    <div id="menu-flutuante">
        <button class="btn-marcar" onclick="adicionarPontoAtual()">📍 Marcar Ponto</button>
        <button class="btn-pdf" onclick="document.getElementById('file-pdf').click()">📄 Importar PDF</button>
        <button class="btn-lixeira" onclick="apagarTodasMarcacoes()">🗑️ Apagar Tudo</button>
        <input type="file" id="file-pdf" accept="application/pdf" style="display: none;" onchange="importarPDF(event)">
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inicialização do Mapa
        const map = L.map('map', {
            maxZoom: 22,
            minZoom: 3
        }).setView([-15.7801, -47.9292], 15);

        // Camada de Satélite com Correção de Zoom
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 22,
            maxNativeZoom: 19, // Corrige a tela branca ao aproximar muito
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        // Geolocalização
        let markerGPS = null;
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition((position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                if (!markerGPS) {
                    markerGPS = L.marker([lat, lng], {
                        icon: L.divIcon({ className: 'user-location-marker', iconSize: [10, 10], iconAnchor: [5, 5] })
                    }).addTo(map);
                } else {
                    markerGPS.setLatLng([lat, lng]);
                }
            }, null, { enableHighAccuracy: true });
        }

        // Sistema de Botão e Menu
        const btnFlutuante = document.getElementById('btn-flutuante');
        const menuFlutuante = document.getElementById('menu-flutuante');

        L.DomEvent.disableClickPropagation(btnFlutuante);
        L.DomEvent.disableClickPropagation(menuFlutuante);

        btnFlutuante.addEventListener('click', (e) => {
            menuFlutuante.style.display = (menuFlutuante.style.display === 'flex') ? 'none' : 'flex';
        });

        function adicionarPontoAtual() {
            let pos = markerGPS ? markerGPS.getLatLng() : map.getCenter();
            L.marker([pos.lat, pos.lng]).addTo(map).bindPopup("Ponto marcado");
            menuFlutuante.style.display = 'none';
        }

        function apagarTodasMarcacoes() {
            location.reload(); 
        }

        function importarPDF(e) { menuFlutuante.style.display = 'none'; }

        map.on('click', () => { menuFlutuante.style.display = 'none'; });
    </script>
</body>
</html>
