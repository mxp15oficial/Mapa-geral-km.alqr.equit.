<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Mapas Satélite Offline</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: Arial, sans-serif; }
        #map { width: 100%; height: 100vh; }
        
        /* Botão Flutuante Organizado */
        #btn-flutuante {
            position: fixed;
            bottom: 30px;
            right: 20px;
            width: 60px;
            height: 60px;
            background-color: #28a745;
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            cursor: pointer;
            z-index: 9999;
            user-select: none;
        }

        /* Menu de Ações do Botão Flutuante */
        #menu-flutuante {
            position: fixed;
            bottom: 100px;
            right: 20px;
            background: white;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            display: none;
            z-index: 9999;
            flex-direction: column;
            gap: 8px;
        }
        #menu-flutuante button {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            text-align: left;
            font-size: 14px;
        }
        .btn-marcar { background-color: #007bff; }
        .btn-pdf { background-color: #ffc107; color: black !important; }
        .btn-lixeira { background-color: #dc3545; }

        /* Ponto Azul Reduzido pela Metade */
        .user-location-marker {
            background-color: #007bff;
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

    <!-- Botão Flutuante Principal -->
    <div id="btn-flutuante">⚙️</div>

    <!-- Menu de Configurações -->
    <div id="menu-flutuante">
        <button class="btn-marcar" onclick="adicionarPontoAtual()">📍 Marcar Ponto</button>
        <button class="btn-pdf" onclick="document.getElementById('file-pdf').click()">📄 Importar PDF</button>
        <button class="btn-lixeira" onclick="apagarTodasMarcacoes()">🗑️ Apagar Tudo</button>
        <input type="file" id="file-pdf" accept="application/pdf" style="display: none;" onchange="importarPDF(event)">
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Inicialização do Mapa (Zoom travado no 19 para evitar tela cinza)
        const map = L.map('map', {
            maxZoom: 19,
            minZoom: 3
        }).setView([-15.7801, -47.9292], 15);

        // Camada de Satélite Otimizada
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            maxNativeZoom: 19,
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        // 2. Geolocalização em Tempo Real com Bolinha Reduzida
        let markerGPS = null;
        let primeiroZoom = true;

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    if (!markerGPS) {
                        const iconeAzul = L.divIcon({
                            className: 'user-location-marker',
                            iconSize: [10, 10],
                            iconAnchor: [5, 5]
                        });
                        markerGPS = L.marker([lat, lng], { icon: iconeAzul }).addTo(map)
                            .bindPopup("Você está aqui");
                    } else {
                        markerGPS.setLatLng([lat, lng]);
                    }

                    if (primeiroZoom) {
                        map.setView([lat, lng], 17);
                        primeiroZoom = false;
                    }
                },
                (error) => { console.warn("GPS desativado"); },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
            );
        }

        // 3. Sistema de Pontos Fixos (Persistência)
        let marcadoresSalvos = JSON.parse(localStorage.getItem('meus_pontos')) || [];

        marcadoresSalvos.forEach(coord => {
            L.marker([coord.lat, coord.lng]).addTo(map)
              .bindPopup(`Ponto salvo em: ${coord.data}`);
        });

        // 4. Controle Perfeito do Botão de Configurações
        const btnFlutuante = document.getElementById('btn-flutuante');
        const menuFlutuante = document.getElementById('menu-flutuante');

        // Impede que o mapa bloqueie os cliques no botão e no menu
        L.DomEvent.disableClickPropagation(btnFlutuante);
        L.DomEvent.disableClickPropagation(menuFlutuante);

        function toggleMenu(e) {
            if (e) e.stopPropagation();
            if (menuFlutuante.style.display === 'flex') {
                menuFlutuante.style.display = 'none';
            } else {
                menuFlutuante.style.display = 'flex';
            }
        }

        // Evento de clique limpo e direto para abrir as configurações
        btnFlutuante.addEventListener('click', (e) => {
            toggleMenu(e);
        });

        btnFlutuante.addEventListener('touchend', (e) => {
            e.preventDefault();
            toggleMenu(e);
        });

        function adicionarPontoAtual() {
            let latlngParaMarcar = markerGPS ? markerGPS.getLatLng() : map.getCenter();
            const novoPonto = { lat: latlngParaMarcar.lat, lng: latlngParaMarcar.lng, data: new Date().toLocaleString() };
            
            marcadoresSalvos.push(novoPonto);
            localStorage.setItem('meus_pontos', JSON.stringify(marcadoresSalvos));

            L.marker([novoPonto.lat, novoPonto.lng]).addTo(map)
              .bindPopup(`Ponto fixo salvo em: ${novoPonto.data}`)
              .openPopup();

            alert('Ponto fixo salvo com sucesso!');
            menuFlutuante.style.display = 'none';
        }

        function importarPDF(event) {
            const arquivo = event.target.files[0];
            if (arquivo) {
                alert(`PDF "${arquivo.name}" selecionado!`);
            }
            menuFlutuante.style.display = 'none';
        }

        function apagarTodasMarcacoes() {
            if (confirm("Tem certeza que deseja apagar todas as marcações?")) {
                localStorage.removeItem('meus_pontos');
                marcadoresSalvos = [];
                location.reload(); 
            }
        }

        // Fecha o menu ao tocar em qualquer outro lugar do mapa
        map.on('click', () => {
            menuFlutuante.style.display = 'none';
        });
    </script>
</body>
</html>
