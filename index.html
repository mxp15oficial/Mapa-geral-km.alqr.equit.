<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de Mapas Satélite Offline</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet Control Search CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-search@2.9.8/dist/leaflet-search.min.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: Arial, sans-serif; }
        #map { width: 100%; height: 100vh; }
        
        /* Botão Flutuante (Arrastável, gruda nas bordas e abre o menu) */
        #btn-flutuante {
            position: fixed;
            bottom: 30px;
            right: 20px;
            width: 60px;
            height: 60px;
            background-color: #28a745;
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            cursor: pointer;
            z-index: 3000;
            touch-action: none;
            user-select: none;
        }

        /* Menu de Ações do Botão Flutuante */
        #menu-flutuante {
            position: fixed;
            bottom: 100px;
            right: 20px;
            background: white;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: none;
            z-index: 3000;
            flex-direction: column;
            gap: 8px;
        }
        #menu-flutuante button {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            text-align: left;
            font-size: 14px;
        }
        .btn-marcar { background-color: #007bff; }
        .btn-pdf { background-color: #ffc107; color: black !important; }
        .btn-lixeira { background-color: #dc3545; }

        /* Barra de Pesquisa Visível no Topo */
        .leaflet-control-search {
            position: absolute !important;
            top: 15px !important;
            left: 60px !important;
            right: 15px !important;
            width: auto !important;
            margin: 0 !important;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4) !important;
            border-radius: 8px !important;
            background: white;
            z-index: 1000;
        }
        .leaflet-control-search .search-input {
            width: 100% !important;
            height: 40px;
            padding: 5px 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
            box-sizing: border-box;
        }
        .leaflet-control-search .search-button {
            display: none; 
        }

        /* Ponto Azul Reduzido pela Metade */
        .user-location-marker {
            background-color: #007bff;
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

    <!-- Botão Flutuante Principal -->
    <div id="btn-flutuante">⚙️</div>

    <!-- Menu de Configurações -->
    <div id="menu-flutuante">
        <button class="btn-marcar" onclick="adicionarPontoAtual()">📍 Marcar Ponto</button>
        <button class="btn-pdf" onclick="document.getElementById('file-pdf').click()">📄 Importar PDF</button>
        <button class="btn-lixeira" onclick="apagarTodasMarcacoes()">🗑️ Apagar Tudo</button>
        <input type="file" id="file-pdf" accept="application/pdf" style="display: none;" onchange="importarPDF(event)">
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Control Search JS -->
    <script src="https://unpkg.com/leaflet-search@2.9.8/dist/leaflet-search.min.js"></script>
    <script>
        // 1. Inicialização do Mapa com Zoom estendido sem dar tela branca
        const map = L.map('map', {
            maxZoom: 22,
            minZoom: 3
        }).setView([-15.7801, -47.9292], 15);

        // Camada de Satélite com maxNativeZoom para evitar tela cinza/branca no zoom máximo
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 22,
            maxNativeZoom: 19,
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        // 2. Geolocalização em Tempo Real com Bolinha Reduzida
        let markerGPS = null;
        let primeiroZoom = true;

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    if (!markerGPS) {
                        const iconeAzul = L.divIcon({
                            className: 'user-location-marker',
                            iconSize: [10, 10],
                            iconAnchor: [5, 5]
                        });
                        markerGPS = L.marker([lat, lng], { icon: iconeAzul }).addTo(map)
                            .bindPopup("Você está aqui");
                    } else {
                        markerGPS.setLatLng([lat, lng]);
                    }

                    if (primeiroZoom) {
                        map.setView([lat, lng], 18);
                        primeiroZoom = false;
                    }
                },
                (error) => { console.warn("GPS desativado"); },
                { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
            );
        }

        // 3. Camada de Talhões (Exemplo para Pesquisa)
        const talhoesExemplo = {
            "type": "FeatureCollection",
            "features": [
                {
                    "type": "Feature",
                    "geometry": {
                        "type": "Polygon",
                        "coordinates": [
                            [
                                [-47.935, -15.780],
                                [-47.930, -15.780],
                                [-47.930, -15.775],
                                [-47.935, -15.775],
                                [-47.935, -15.780]
                            ]
                        ]
                    },
                    "properties": { "nome": "Talhão 01" }
                }
            ]
        };

        const camadaTalhoes = L.geoJSON(talhoesExemplo, {
            style: { color: "#ffcc00", weight: 2, fillOpacity: 0.2 },
            onEachFeature: function (feature, layer) {
                if (feature.properties && feature.properties.nome) {
                    layer.bindPopup(feature.properties.nome);
                }
            }
        }).addTo(map);

        // 4. Barra de Pesquisa Visível no Topo
        const searchControl = new L.Control.Search({
            layer: camadaTalhoes,
            propertyName: 'nome',
            marker: false,
            textPlaceholder: 'Pesquisar talhão...',
            moveToLocation: function(latlng, title, map) {
                map.setView(latlng, 18);
            }
        });
        map.addControl(searchControl);

        // 5. Sistema de Pontos Fixos (Persistência)
        let marcadoresSalvos = JSON.parse(localStorage.getItem('meus_pontos')) || [];

        marcadoresSalvos.forEach(coord => {
            L.marker([coord.lat, coord.lng]).addTo(map)
              .bindPopup(`Ponto salvo em: ${coord.data}`);
        });

        // 6. Funções do Menu Flutuante
        const btnFlutuante = document.getElementById('btn-flutuante');
        const menuFlutuante = document.getElementById('menu-flutuante');

        function toggleMenu() {
            if (menuFlutuante.style.display === 'flex') {
                menuFlutuante.style.display = 'none';
            } else {
                menuFlutuante.style.display = 'flex';
            }
        }

        function adicionarPontoAtual() {
            let latlngParaMarcar = markerGPS ? markerGPS.getLatLng() : map.getCenter();
            const novoPonto = { lat: latlngParaMarcar.lat, lng: latlngParaMarcar.lng, data: new Date().toLocaleString() };
            
            marcadoresSalvos.push(novoPonto);
            localStorage.setItem('meus_pontos', JSON.stringify(marcadoresSalvos));

            L.marker([novoPonto.lat, novoPonto.lng]).addTo(map)
              .bindPopup(`Ponto fixo salvo em: ${novoPonto.data}`)
              .openPopup();

            alert('Ponto fixo salvo com sucesso!');
            menuFlutuante.style.display = 'none';
        }

        function importarPDF(event) {
            const arquivo = event.target.files[0];
            if (arquivo) {
                alert(`PDF "${arquivo.name}" selecionado!`);
            }
            menuFlutuante.style.display = 'none';
        }

        function apagarTodasMarcacoes() {
            if (confirm("Tem certeza que deseja apagar todas as marcações?")) {
                localStorage.removeItem('meus_pontos');
                marcadoresSalvos = [];
                location.reload(); 
            }
        }

        // 7. Lógica Otimizada para Arrastar e Clicar sem falhas no Mobile
        let isDragging = false;
        let startX, startY;

        btnFlutuante.addEventListener('pointerdown', (e) => {
            isDragging = false;
            startX = e.clientX;
            startY = e.clientY;
        });

        btnFlutuante.addEventListener('pointermove', (e) => {
            if (Math.abs(e.clientX - startX) > 6 || Math.abs(e.clientY - startY) > 6) {
                isDragging = true;
            }
            if (!isDragging) return;

            let x = e.clientX - 30;
            let y = e.clientY - 30;
            const maxX = window.innerWidth - 60;
            const maxY = window.innerHeight - 60;
            x = Math.max(0, Math.min(x, maxX));
            y = Math.max(0, Math.min(y, maxY));
            
            btnFlutuante.style.left = x + 'px';
            btnFlutuante.style.top = y + 'px';
            btnFlutuante.style.bottom = 'auto';
            btnFlutuante.style.right = 'auto';
            menuFlutuante.style.display = 'none';
        });

        btnFlutuante.addEventListener('click', (e) => {
            // Só ativa o clique se o usuário não estava arrastando o botão
            if (!isDragging) {
                toggleMenu();
            }
        });

        // Fecha o menu se clicar em qualquer outra parte do mapa
        document.addEventListener('click', (e) => {
            if (!btnFlutuante.contains(e.target) && !menuFlutuante.contains(e.target)) {
                menuFlutuante.style.display = 'none';
            }
        });
    </script>
</body>
</html>
